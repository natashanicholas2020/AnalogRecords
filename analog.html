<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="analog.css">
    <title>Analog Records</title>
</head>
<body>
    <div class="crate">
        <div class="crate-front"></div>
    </div>

    <div class="record-box">
        <div class="platter"></div>

        <div class="record">
            <div class="circle outer">
                <div class="circle inner"></div>
            </div>
        </div>

        <div class="arm-base"></div>
        <div class="arm">
            <div class="counterweight"></div>
            <div class="headshell"></div>
        </div>

        <div class="display">
            <p class="display-label">Now playing</p>
            <div class="display-window">
                <span class="display-text">No record on the platter</span>
            </div>
        </div>
    </div>

    <script src="analog.js"></script>
</body>
</html>
